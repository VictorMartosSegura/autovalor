spring.application.name=autovalor

# PostgreSQL Aiven configuration. Do not commit real credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration. Use a long random secret in production.
# In local development, this fallback avoids startup errors if JWT_SECRET is not configured.
app.jwt.secret=${JWT_SECRET:autovalor-local-development-jwt-secret-change-me-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Uploaded listing images.
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-images-per-listing=${MAX_IMAGES_PER_LISTING:6}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# AI vehicle suggestions. Disabled by default to keep local tests and development independent from external APIs.
app.ai.enabled=${AI_ENABLED:false}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Unique admin account. If these variables are empty, no admin is auto-created.
app.admin.name=${ADMIN_NAME:AutoValor Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
